<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A1128">
    <title>Offline | Offline Airport Help</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            font-family: Inter, Arial, sans-serif;
            color: #1a1a2e;
            background:
                radial-gradient(circle at top left, rgba(193, 173, 227, 0.5), transparent 30%),
                radial-gradient(circle at bottom right, rgba(180, 216, 191, 0.42), transparent 32%),
                linear-gradient(180deg, #f1e9f7 0%, #efe5d7 50%, #e3efe3 100%);
        }

        .offline-shell {
            width: min(100%, 36rem);
            padding: 2.25rem;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(14px);
            box-shadow: 0 22px 60px rgba(23, 20, 39, 0.14);
            text-align: center;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        p {
            margin: 0 0 1rem;
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 0.5rem;
            padding: 0.95rem 1.4rem;
            border-radius: 999px;
            background: #1a2a4f;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="offline-shell">
        <p>✈️ Offline Airport Help</p>
        <h1>You’re offline, but your airport guide is still nearby.</h1>
        <p>Your saved tickets, chat history, and airport maps are available from the local cache.</p>
        <p>Reconnect when you can and your data will sync automatically.</p>
        <a href="/">Return Home</a>
    </main>
</body>
</html>
